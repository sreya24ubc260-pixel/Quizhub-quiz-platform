<!DOCTYPE html>
<html>
<head>
<title>Create Quiz</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
    body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', sans-serif;
    }

    .form-box {
        background: white;
        padding: 35px;
        border-radius: 20px;
        width: 480px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .form-box h2 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: bold;
        color: #5a3fff;
    }

    .form-control {
        border-radius: 12px;
        padding: 12px;
        border: 1px solid #ddd;
        transition: 0.3s;
    }

    .form-control:focus {
        border-color: #5a3fff;
        box-shadow: 0 0 8px rgba(90,63,255,0.3);
    }

    .btn-save {
        width: 100%;
        border-radius: 12px;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        background: linear-gradient(135deg, #28a745, #218838);
        border: none;
        transition: 0.3s;
    }

    .btn-save:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .icon {
        font-size: 40px;
        text-align: center;
        margin-bottom: 10px;
    }
</style>
</head>

<body>

<div class="form-box">
    <div class="icon">🛠</div>
    <h2>Create Your Quiz</h2>

    <input class="form-control mt-3" placeholder="Enter Question">
    <input class="form-control mt-3" placeholder="Option 1">
    <input class="form-control mt-2" placeholder="Option 2">
    <input class="form-control mt-2" placeholder="Option 3">

    <button class="btn-save mt-4">Save Question</button>
</div>

</body>
</html>
