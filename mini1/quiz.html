<!DOCTYPE html>
<html>
<head>
    <title>Quiz Question</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .quiz-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 520px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .question {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            margin: 8px 0;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #f1f1f1;
            transition: 0.3s;
        }

        .option-btn:hover {
            background: #667eea;
            color: white;
        }

        .correct {
            background: #28a745 !important;
            color: white;
        }

        .wrong {
            background: #dc3545 !important;
            color: white;
        }

        .timer {
            margin-top: 15px;
            font-weight: bold;
            color: #ff4d4d;
        }

        .next-btn {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-box">
    <h3 id="qno">Question 1</h3>
    <div id="question" class="question"></div>

    <div id="options"></div>

    <div class="timer">⏱ Time Left: <span id="timer">20</span>s</div>

    <button class="btn btn-success next-btn" onclick="nextQuestion()">Next Question</button>
</div>

<script>
const quiz = [
    {
        question: "What does HTML stand for?",
        options: [
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyper Tool Mark Language"
        ],
        answer: 0
    },
    {
        question: "Which language is used for styling web pages?",
        options: ["HTML", "JQuery", "CSS"],
        answer: 2
    },
    {
        question: "Which is not a programming language?",
        options: ["Python", "HTML", "Java"],
        answer: 1
    }
];

let currentQ = 0;
let score = 0;
let timeLeft = 20;
let countdown;

function loadQuestion() {
    const q = quiz[currentQ];
    document.getElementById("qno").innerText = `Question ${currentQ + 1}`;
    document.getElementById("question").innerText = q.question;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.innerText = opt;
        btn.classList.add("option-btn");
        btn.onclick = () => checkAnswer(index, btn);
        optionsDiv.appendChild(btn);
    });

    document.querySelector(".next-btn").style.display = "none";
    startTimer();
}

function checkAnswer(selected, btn) {
    clearInterval(countdown);
    const correct = quiz[currentQ].answer;

    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach((b, i) => {
        if (i === correct) b.classList.add("correct");
        if (i === selected && i !== correct) b.classList.add("wrong");
        b.disabled = true;
    });

    if (selected === correct) score++;

    document.querySelector(".next-btn").style.display = "block";
}

function nextQuestion() {
    currentQ++;

    if (currentQ < quiz.length) {
        timeLeft = 20;
        loadQuestion();
    } else {
        showResult();
    }
}

function startTimer() {
    document.getElementById("timer").innerText = timeLeft;

    countdown = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            document.querySelectorAll(".option-btn").forEach(b => b.disabled = true);
            document.querySelector(".next-btn").style.display = "block";
        }
    }, 1000);
}

function showResult() {
    document.querySelector(".quiz-box").innerHTML = `
        <h2>🎉 Congratulations!</h2>
        <p>You completed the quiz.</p>
        <h3>Your Score: ${score} / ${quiz.length}</h3>
        <button class="btn btn-primary mt-3" onclick="location.reload()">Play Again</button>
    `;
}

loadQuestion();
</script>

</body>
</html>
